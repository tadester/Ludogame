# Applies Supabase migrations to the linked project on every push to main.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – a personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   – the project's database password
#   SUPABASE_PROJECT_ID    – the project ref (e.g. ihpsxfgzplruwgaahjdd)
#
# `supabase db push` only applies migrations not already recorded in the
# project's migration history, so it is safe to run on every push. If the
# remote history is out of sync with these files, run `supabase migration
# repair` once locally to reconcile it before relying on this workflow.

name: Deploy DB migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-db.yml"
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Push migrations
        run: supabase db push
