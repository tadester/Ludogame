<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Ludo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Arial, Helvetica, sans-serif;
        color: #f8fafc;
        background:
          radial-gradient(circle at top, #19324b 0, transparent 42%), #07111f;
      }
      .card {
        max-width: 22rem;
        text-align: center;
        padding: 2rem 1.5rem;
        border: 1px solid #31506c;
        border-radius: 1rem;
        background: rgba(16, 34, 56, 0.85);
      }
      .mark {
        width: 0.9rem;
        height: 0.9rem;
        margin: 0 auto 1rem;
        border-radius: 999px;
        background: #d4af37;
        box-shadow: 0 0 1.25rem rgba(212, 175, 55, 0.5);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>
        Reconnect to keep playing. Pass-the-phone games already loaded on this
        device will keep working.
      </p>
    </main>
  </body>
</html>
